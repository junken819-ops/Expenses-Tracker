[build]
  publish = "."

[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

# Keep local financial data and development-only source files out of the
# public surface if this folder is deployed as a static Netlify site.
[[redirects]]
  from = "/user_data.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/user_data.json.bak"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/user_data.json.tmp.*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.js"
  to = "/index.html"
  status = 404
  force = true
